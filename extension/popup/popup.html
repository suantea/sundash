<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=380, initial-scale=1.0">
  <title>SunDash Monitor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="2" width="8" height="8" rx="2" fill="#2080f0"/>
          <rect x="14" y="2" width="8" height="8" rx="2" fill="#2080f0" opacity="0.6"/>
          <rect x="2" y="14" width="8" height="8" rx="2" fill="#2080f0" opacity="0.6"/>
          <rect x="14" y="14" width="8" height="8" rx="2" fill="#2080f0" opacity="0.3"/>
        </svg>
        <span>SunDash</span>
      </div>
      <div class="header-actions">
        <button id="btn-toggle-monitor" class="btn-icon" title="开关监控">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
          </svg>
        </button>
        <button id="btn-settings" class="btn-icon" title="设置">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="status-bar">
      <span id="monitor-status" class="status-dot"></span>
      <span id="monitor-text">监控已关闭</span>
      <span id="monitor-count" class="badge">0</span>
    </div>

    <div class="current-page">
      <div class="page-info">
        <span id="page-title" class="page-title">当前页面</span>
        <span id="page-url" class="page-url"></span>
      </div>
      <button id="btn-add-monitor" class="btn-add" title="添加到监控">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
        </svg>
      </button>
    </div>

    <div class="monitor-list">
      <div class="list-header">
        <span>监控列表</span>
        <button id="btn-clear-all" class="btn-text">清空</button>
      </div>
      <div id="monitor-items" class="items">
        <div class="empty-state">暂无监控项目</div>
      </div>
    </div>

    <div class="footer">
      <button id="btn-open-panel" class="btn-primary">打开面板</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
